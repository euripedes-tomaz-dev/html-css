<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeçalho Estilizado</title>
    <style>

        table{
            border-collapse: collapse;
            width: 400px;
        }

        thead{
            background-color: purple;
            color: white;
        }

        th, td{
            border: 1px solid black;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Cabeçalho Estilizado</h1>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Estoque</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>R$ 3.500,00</td>
                <td>5</td>
            </tr>

            <tr>
                <td>Mouse</td>
                <td>R$ 50,00</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Teclado</td>
                <td>R$ 150,00</td>
                <td>10</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
