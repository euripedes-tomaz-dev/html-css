<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Simples com Bordas</title>
    <style>
        table{
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Tabela Simples com Bordas</h1>
    <table>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Idade</th>
                <th scope="col">Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>João Silva</td>
                <td>28</td>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Maria Santos</td>
                <td>32</td>
                <td>Rio de Janeiro</td>
            </tr>
            <tr>
                <td>Pedro Costa</td>
                <td>25</td>
                <td>Belo Horizonte</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
