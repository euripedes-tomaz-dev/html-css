<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura Grande (thead, tbody, tfoot)</title>
    <style>
        table{
            width: 600px;
            border-collapse: collapse;
        }
        thead > tr > th{
            text-align: center;
        }

        th,td{
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

    </style>
</head>
<body>
      <table>
        
        <thead>
            <tr>
                <th scope="col">Produto</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Valor Unitário</th>
                <th scope="col">Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Café Premium</td>
                <td>10</td>
                <td>R$ 25,00</td>
                <td>R$ 250,00</td>
            </tr>

            <tr>
                <td>Pão Francês</td>
                <td>30</td>
                <td>R$ 1,50</td>
                <td>R$ 45,00</td>
            </tr>

            <tr>
                <td>Bolo de Chocolate</td>
                <td>5</td>
                <td>R$ 35,00</td>
                <td>R$ 175,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3" scope="row">TOTAL</th>
                <td>R$ 470,00</td>
            </tr>
        </tfoot>
      </table>
</body>
</html>
