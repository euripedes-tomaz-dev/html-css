<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Responsiva</title>
    <style>
        table{
            width: 400px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }
        .responsiva{
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="responsiva">
        <table>
            <thead>
                <th scope="col">Produto</th>
                <th scope="col">Jan</th>
                <th scope="col">Fev</th>
                <th scope="col">Mar</th>
                <th scope="col">Abr</th>
                <th scope="col">Mai</th>
                <th scope="col">Jun</th>
                <th scope="col">Jul</th>
                <th scope="col">Ago</th>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Smartphones</th>
                    <td>150</td>
                    <td>160</td>
                    <td>175</td>
                    <td>190</td>
                    <td>210</td>
                    <td>225</td>
                    <td>240</td>
                    <td>255</td>
                </tr>
                <tr>
                    <th scope="row">Tablets</th>
                    <td>80</td>
                    <td>85</td>
                    <td>95</td>
                    <td>100</td>
                    <td>110</td>
                    <td>120</td>
                    <td>135</td>
                    <td>145</td>
                </tr>
                <tr>
                    <th scope="row">Laptops</th>
                    <td>60</td>
                    <td>70</td>
                    <td>75</td>
                    <td>85</td>
                    <td>90</td>
                    <td>100</td>
                    <td>115</td>
                    <td>125</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
