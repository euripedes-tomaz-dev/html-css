<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption (Título da Tabela)</title>
    <style>
        table{
            width: 500px;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        caption{
            padding: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

    </style>
</head>
<body>
    <table>
        <caption>&#x1F4CA; Análise de Tráfego do Site - Setembro 2024</caption>
        <thead>
            <tr>
                <th scope="col">Semana</th>
                <th scope="col">Visitantes</th>
                <th scope="col">Páginas Vistas</th>
                <th scope="col">Taxa de Rejeição</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Semana 1</td>
                <td>1.250</td>
                <td>3.500</td>
                <td>45%</td>
            </tr>
            <tr>
                <td>Semana 2</td>
                <td>1.890</td>
                <td>5.200</td>
                <td>38%</td>
            </tr>
            <tr>
                <td>Semana 3</td>
                <td>2.100</td>
                <td>6.800</td>
                <td>32%</td>
            </tr>
            <tr>
                <td>Semana 4</td>
                <td>2.450</td>
                <td>7.200</td>
                <td>28%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
