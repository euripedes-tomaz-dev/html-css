<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição Relativa vs. Absoluta</title>
</head>
<style>
    .caixa-pai{
        width: 300px;
        height: 300px;
        background-color: gray;
        position: relative;
    }

    .caixa-filho{
        width: 100px;
        height: 100px;
        background-color: aqua;
        position: absolute;
        top: 0;
        left: 0;
    }
    
</style>
<body>
    <div class="caixa-pai">
        Caixa Pai
        <div class="caixa-filho">
            Caixa Filho
        </div>
    </div>
    
</body>
</html>
