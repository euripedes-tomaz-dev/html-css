<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto de Perfil Online</title>
    <style>
        div.pai{
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: purple;
        }

        div.filho{
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: green;
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho"
        </div>
    </div>
    
</body>
</html>
