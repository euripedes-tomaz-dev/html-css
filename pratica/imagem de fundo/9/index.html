<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizar uma caixa</title>
    <style>
        div#pai{
             position: relative;
            height: 300px;
            width: 300px;
            border: 1px solid black;
            top: -5px;
            left: -5px;
        }

        div#filha{
            position: absolute;
            border: 1px solid blue;
            height: 100px;
            width: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="pai">
        <div id="filha">

        </div>
    </div> 
</body>
</html>
