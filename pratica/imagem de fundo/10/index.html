<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Card de Feed de Notícias</title>
    <style>
        div#foto{
            position: relative;
            width: 300px;
            height: 300px;
            background-color: lightgray;

        }

        div#salvar{
            position: absolute;
            background-color: blue;
            color: white;
            width: 70px;
            border-radius: 10px;
            text-align: center;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div id="foto">
        <div id="salvar">
            <p>salvar</p>
        </div>
    </div>
    
</body>
</html>
