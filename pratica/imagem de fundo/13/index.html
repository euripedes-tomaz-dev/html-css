<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selo de Notificação</title>
    <style>
        body{
            padding: 10px;
        }

        .container-botao{
            position: relative;
            display: inline-block;
        }

        .badge{
            position: absolute;
            top: 0;
            right: 0;
            transform: translate(50%, -50%);
            color: red;
            
        }
    </style>
</head>
<body>
    <div class="container-botao">
        <button class="btn">Notificações</button>
        <span class="badge">3</span>
    </div>
</body>
</html>
